services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: optigate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optigate}
      POSTGRES_DB: mcp_registry
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U optigate -d mcp_registry']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      NODE_ENV: production
      PORT: 8100
      # keycloak = Keycloak JWT (default) · local = username/password login
      # (needs LOCAL_JWT_SECRET + bootstrap admin, see .env.example)
      AUTH_MODE: ${AUTH_MODE:-keycloak}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      APPROVAL_REQUIRED: ${APPROVAL_REQUIRED:-true}
      DATABASE_URL: postgres://optigate:${POSTGRES_PASSWORD:-optigate}@db:5432/mcp_registry
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      SSRF_ALLOWED_HOSTS: ${SSRF_ALLOWED_HOSTS}
      CORS_ORIGIN: ${CORS_ORIGIN}
      # ── Local auth (only evaluated when AUTH_MODE=local) ──────────────
      LOCAL_JWT_SECRET: ${LOCAL_JWT_SECRET:-}
      LOCAL_JWT_TTL: ${LOCAL_JWT_TTL:-12h}
      LOCAL_BOOTSTRAP_ADMIN_USER: ${LOCAL_BOOTSTRAP_ADMIN_USER:-}
      LOCAL_BOOTSTRAP_ADMIN_PASSWORD: ${LOCAL_BOOTSTRAP_ADMIN_PASSWORD:-}
      LOCAL_BOOTSTRAP_ADMIN_TENANT: ${LOCAL_BOOTSTRAP_ADMIN_TENANT:-}
    ports:
      - '8100:8100'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8100/health']
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - '8080:80'
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
